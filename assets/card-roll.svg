<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" role="img" aria-label="roll: Your camera roll, sorted.">
<defs>
  <clipPath id="c"><rect width="600" height="220" rx="18"/></clipPath>
  <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11131c"/><stop offset="1" stop-color="#090a10"/></linearGradient>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#db2777"/></linearGradient>
</defs>
<g clip-path="url(#c)">
  <rect width="600" height="220" fill="url(#bg)"/>
  <circle cx="560" cy="20" r="120" fill="#db2777" opacity=".35" filter="url(#b)"/>
  <rect x="-200" y="-40" width="140" height="320" fill="url(#sheen)" transform="skewX(-20)"><animate attributeName="x" dur="7s" repeatCount="indefinite" keyTimes="0;.35;1" values="-200;800;800"/></rect>
  <rect x="32" y="30" width="52" height="52" rx="14" fill="url(#ic)"/>
  <g transform="translate(32 30)" fill="none" stroke="#0b0c12" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="16" width="24" height="20" rx="3"/><path d="M18 12 H38 a3 3 0 0 1 3 3 V30"/><path d="M14 33 l7-7 5 5 3-3 5 5"/><circle cx="29" cy="22" r="1.6"/></g>
  <text x="102" y="66" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" fill="#e6edf3">roll</text>
  <g transform="translate(548 40)" stroke="#8b949e" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M0 14 L14 0 M3 0 H14 V11"/></g>
  <text x="32" y="114" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#e6edf3">Your camera roll, sorted.</text>
  <text x="32" y="140" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#8b949e">100k-file phone dumps into a clean archive, by year.</text>
  <g font-family="ui-monospace, 'Cascadia Code', SFMono-Regular, Consolas, Menlo, monospace" font-size="13"><rect x="32" y="160" width="63" height="28" rx="14" fill="#fdba74" fill-opacity=".12" stroke="#fdba74" stroke-opacity=".35"/><text x="44" y="179" textLength="39" lengthAdjust="spacingAndGlyphs" fill="#fdba74">tauri</text><rect x="103" y="160" width="55.2" height="28" rx="14" fill="#fdba74" fill-opacity=".12" stroke="#fdba74" stroke-opacity=".35"/><text x="115" y="179" textLength="31.2" lengthAdjust="spacingAndGlyphs" fill="#fdba74">rust</text><rect x="166.2" y="160" width="70.8" height="28" rx="14" fill="#fdba74" fill-opacity=".12" stroke="#fdba74" stroke-opacity=".35"/><text x="178.2" y="179" textLength="46.8" lengthAdjust="spacingAndGlyphs" fill="#fdba74">svelte</text><rect x="245" y="160" width="109.8" height="28" rx="14" fill="#fdba74" fill-opacity=".12" stroke="#fdba74" stroke-opacity=".35"/><text x="257" y="179" textLength="85.8" lengthAdjust="spacingAndGlyphs" fill="#fdba74">local-first</text></g>
  <circle cx="508" cy="174" r="6" fill="#dea584"/>
  <text x="520" y="179" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8b949e">Rust</text>
</g>
<rect x=".5" y=".5" width="599" height="219" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>