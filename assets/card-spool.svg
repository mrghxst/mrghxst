<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" role="img" aria-label="spool: Usenet in a browser tab.">
<defs>
  <clipPath id="c"><rect width="600" height="220" rx="18"/></clipPath>
  <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11131c"/><stop offset="1" stop-color="#090a10"/></linearGradient>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
</defs>
<g clip-path="url(#c)">
  <rect width="600" height="220" fill="url(#bg)"/>
  <circle cx="560" cy="20" r="120" fill="#0891b2" opacity=".35" filter="url(#b)"/>
  <rect x="-200" y="-40" width="140" height="320" fill="url(#sheen)" transform="skewX(-20)"><animate attributeName="x" dur="7s" repeatCount="indefinite" keyTimes="0;.35;1" values="-200;800;800"/></rect>
  <rect x="32" y="30" width="52" height="52" rx="14" fill="url(#ic)"/>
  <g transform="translate(32 30)" fill="none" stroke="#0b0c12" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="26" r="13"/><circle cx="26" cy="26" r="3.5"/><path d="M26 13 V9 M26 39 V43 M13 26 H9 M39 26 H43"/></g>
  <text x="102" y="66" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" fill="#e6edf3">spool</text>
  <g transform="translate(548 40)" stroke="#8b949e" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M0 14 L14 0 M3 0 H14 V11"/></g>
  <text x="32" y="114" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#e6edf3">Usenet in a browser tab.</text>
  <text x="32" y="140" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#8b949e">Download, yEnc, PAR2 repair and unpack, all in the tab.</text>
  <g font-family="ui-monospace, 'Cascadia Code', SFMono-Regular, Consolas, Menlo, monospace" font-size="13"><rect x="32" y="160" width="55.2" height="28" rx="14" fill="#67e8f9" fill-opacity=".12" stroke="#67e8f9" stroke-opacity=".35"/><text x="44" y="179" textLength="31.2" lengthAdjust="spacingAndGlyphs" fill="#67e8f9">rust</text><rect x="95.2" y="160" width="55.2" height="28" rx="14" fill="#67e8f9" fill-opacity=".12" stroke="#67e8f9" stroke-opacity=".35"/><text x="107.2" y="179" textLength="31.2" lengthAdjust="spacingAndGlyphs" fill="#67e8f9">wasm</text><rect x="158.4" y="160" width="70.8" height="28" rx="14" fill="#67e8f9" fill-opacity=".12" stroke="#67e8f9" stroke-opacity=".35"/><text x="170.4" y="179" textLength="46.8" lengthAdjust="spacingAndGlyphs" fill="#67e8f9">svelte</text><rect x="237.2" y="160" width="78.6" height="28" rx="14" fill="#67e8f9" fill-opacity=".12" stroke="#67e8f9" stroke-opacity=".35"/><text x="249.2" y="179" textLength="54.6" lengthAdjust="spacingAndGlyphs" fill="#67e8f9">privacy</text></g>
  <circle cx="508" cy="174" r="6" fill="#dea584"/>
  <text x="520" y="179" font-family="'Segoe UI', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8b949e">Rust</text>
</g>
<rect x=".5" y=".5" width="599" height="219" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>