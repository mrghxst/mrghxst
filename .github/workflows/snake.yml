name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#a78bfa&color_dots=#ebedf0,#c4b5fd,#a78bfa,#7c3aed,#5b21b6
            dist/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#3b2a6b,#6d4fc2,#a78bfa,#ddd6fe

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
